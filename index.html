<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>吉他指板</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>吉他指板</h1>
        <p class="sub">v0.2</p>
      </div>
      <div class="toolbar">
        <div id="zoom-ctl"></div>
        <div id="mode-switch"></div>
        <button type="button" class="btn" id="color-btn" aria-expanded="false" aria-controls="color-panel">调色</button>
      </div>
    </header>
    <main>
      <div class="controls" id="controls">
        <div class="ctl-group">
          <span class="ctl-title">音阶</span>
          <label class="field">根音 <select id="root-select" aria-label="音阶根音"></select></label>
          <label class="field">类型 <select id="scale-select" aria-label="音阶类型"></select></label>
        </div>
        <div class="ctl-group">
          <span class="ctl-title">和弦</span>
          <label class="field">根音 <select id="chord-root-select" aria-label="和弦根音"></select></label>
          <label class="field">类型 <select id="chord-select" aria-label="和弦类型"></select></label>
        </div>
        <div class="ctl-group">
          <span class="ctl-title">指板</span>
          <label class="field">品数 <select id="fret-select" aria-label="品数"></select></label>
        </div>
        <div class="field">显示
          <div class="segmented" id="label-mode" role="radiogroup" aria-label="圆点上显示什么">
            <button type="button" role="radio" data-label="name">音名</button>
            <button type="button" role="radio" data-label="degree">音级</button>
            <button type="button" role="radio" data-label="interval">音程</button>
          </div>
        </div>
      </div>
      <div class="board-wrap">
        <svg id="fretboard" role="img" aria-label="吉他指板，标准调弦"></svg>
      </div>
      <div class="legend" id="legend" hidden></div>
      <section id="color-panel" class="color-panel" hidden aria-label="调色面板"></section>
    </main>
  </div>
  <script src="js/theory.js"></script>
  <script src="js/app.js"></script>
  <script src="js/theme-ui.js"></script>
</body>
</html>
