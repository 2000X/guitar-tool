<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>吉他指板</title>
  <script src="js/theme.js?v=0.4.2"></script>
  <link rel="stylesheet" href="css/style.css?v=0.4.2">
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>吉他指板</h1>
        <p class="sub">v0.4.2 开发中：发布新版时浏览器立刻用上新文件</p>
      </div>
      <div class="toolbar">
        <div id="zoom-ctl"></div>
        <div id="mode-switch"></div>
        <button type="button" class="btn" id="color-btn" aria-expanded="false" aria-controls="color-panel">调色</button>
      </div>
    </header>
    <main>
      <div class="controls" id="controls">
        <div class="ctl-group">
          <span class="ctl-title">音阶</span>
          <label class="field">根音 <select id="root-select" aria-label="音阶根音"></select></label>
          <label class="field">类型 <select id="scale-select" aria-label="音阶类型"></select></label>
        </div>
        <div class="ctl-group">
          <span class="ctl-title">和弦</span>
          <label class="field">根音 <select id="chord-root-select" aria-label="和弦根音"></select></label>
          <label class="field">类型 <select id="chord-select" aria-label="和弦类型"></select></label>
        </div>
        <div class="ctl-group">
          <span class="ctl-title">指板</span>
          <label class="field">品数 <select id="fret-select" aria-label="品数"></select></label>
        </div>
        <div class="ctl-group">
          <span class="ctl-title">识别</span>
          <button type="button" class="btn toggle" id="identify-btn" aria-pressed="false" aria-controls="identify">识别和弦</button>
        </div>
        <div class="field">显示
          <div class="segmented" id="label-mode" role="radiogroup" aria-label="圆点上显示什么">
            <button type="button" role="radio" data-label="name">音名</button>
            <button type="button" role="radio" data-label="degree">音级</button>
            <button type="button" role="radio" data-label="interval">音程</button>
          </div>
        </div>
      </div>
      <div class="diatonic" id="diatonic">
        <div class="dia-head">
          <span class="ctl-title">顺阶和弦</span>
          <div class="segmented" id="dia-size" role="radiogroup" aria-label="三和弦或七和弦">
            <button type="button" role="radio" data-size="3">三和弦</button>
            <button type="button" role="radio" data-size="4">七和弦</button>
          </div>
          <span class="dia-basis" id="dia-basis"></span>
        </div>
        <div class="dia-buttons" id="dia-buttons" role="group" aria-label="顺阶和弦"></div>
        <span class="dia-empty" id="dia-empty" hidden>先在“音阶”里选一个音阶，这里会列出它的顺阶和弦</span>
        <span class="dia-keys" id="dia-keys">键盘：1～7 选和弦 · 0 关闭 · T 三/七和弦</span>
      </div>
      <div class="identify" id="identify" hidden>
        <div class="id-head">
          <span class="ctl-title">识别和弦</span>
          <span class="id-shape" id="id-shape"></span>
          <button type="button" class="btn" id="id-clear">清除标记</button>
          <button type="button" class="btn toggle" id="id-others-btn" aria-pressed="true">显示其他位置</button>
          <span class="id-tip">点指板做标记，每根弦最多一个音（再点取消）· 点弦名 = 不弹 · 点识别结果 = 在指板上显示这个和弦 · Esc 退出</span>
        </div>
        <div class="id-result" id="id-result"></div>
      </div>
      <div class="board-wrap">
        <svg id="fretboard" role="img" aria-label="吉他指板，标准调弦"></svg>
      </div>
      <div class="legend" id="legend" hidden></div>
      <section id="color-panel" class="color-panel" hidden aria-label="调色面板"></section>
    </main>
  </div>
  <script src="js/theory.js?v=0.4.2"></script>
  <script src="js/app.js?v=0.4.2"></script>
  <script src="js/theme-ui.js?v=0.4.2"></script>
</body>
</html>
